[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrypolicy-fmt"
version = "0.1.0"
description = "A formatter and validator for retry-policy config files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "emilya941" }]

[project.scripts]
retrypolicy-fmt = "retrypolicy.cli:main"

[tool.setuptools.packages.find]
include = ["retrypolicy*"]
